<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>فراخنای ارقام (Digit Span)</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>body { user-select: none; -webkit-user-select: none; touch-action: manipulation; }</style>
</head>
<body class="bg-slate-950 text-slate-100 flex flex-col justify-between min-h-screen p-4 font-sans">
  <header class="w-full max-w-md mx-auto pt-2">
    <div class="flex justify-between items-center text-xs text-slate-400 mb-1">
      <span class="font-bold text-violet-400" id="phaseTitle">حافظه فعال: بازخوانی مستقیم</span>
      <span id="levelBadge">طول زنجیره: ۳</span>
    </div>
    <div class="w-full bg-slate-800 rounded-full h-1.5 overflow-hidden">
      <div id="pBar" class="bg-violet-500 h-1.5 rounded-full w-1/4 transition-all"></div>
    </div>
  </header>

  <main class="w-full max-w-md mx-auto flex-1 flex flex-col items-center justify-center my-2">
    <div id="gameCard" class="w-full bg-slate-900 border border-slate-800 p-5 rounded-2xl text-center space-y-4 shadow-xl">
      
      <!-- پرده نمایش زنجیره -->
      <div id="displayArea" class="py-8 bg-slate-950 rounded-2xl border border-slate-800 shadow-inner">
        <p class="text-xs text-slate-400 mb-2" id="instructionText">ارقام را با دقت مشاهده کنید:</p>
        <div id="digitBox" class="text-5xl font-black text-violet-400 tracking-widest animate-pulse">آماده...</div>
      </div>

      <!-- صفحه کلید وارد کردن -->
      <div id="inputArea" class="hidden space-y-3">
        <div id="userInputDisplay" class="h-12 bg-slate-950 rounded-xl border border-violet-500/50 flex items-center justify-center text-2xl font-black text-white tracking-widest"></div>
        <div class="grid grid-cols-3 gap-2">
          ${[1,2,3,4,5,6,7,8,9].map(n => `<button onclick="typeDigit(${n})" class="bg-slate-800 hover:bg-slate-700 active:scale-95 py-3 rounded-xl font-bold text-xl">${n}</button>`).join('')}
          <button onclick="clearInput()" class="bg-rose-950/80 hover:bg-rose-900 text-rose-300 py-3 rounded-xl font-bold text-xs">پاک کردن</button>
          <button onclick="typeDigit(0)" class="bg-slate-800 hover:bg-slate-700 active:scale-95 py-3 rounded-xl font-bold text-xl">0</button>
          <button onclick="submitSequence()" class="bg-violet-600 hover:bg-violet-500 text-white py-3 rounded-xl font-bold text-xs">تأیید</button>
        </div>
      </div>

    </div>
  </main>

  <footer class="w-full max-w-md mx-auto py-2 text-center text-[10px] text-slate-500">
    WISC-V Working Memory Subtest
  </footer>

  <script>
    const tg = window.Telegram?.WebApp;
    if (tg) { tg.ready(); tg.expand(); }

    const TRIALS = [
      { sequence: [3, 8, 2], mode: 'forward', answer: '382' },
      { sequence: [5, 1, 9, 4], mode: 'forward', answer: '5194' },
      { sequence: [2, 7, 5], mode: 'backward', answer: '572' },
      { sequence: [8, 4, 1, 6], mode: 'backward', answer: '6148' }
    ];

    let currentIdx = 0;
    let correctCount = 0;
    let currentInput = "";

    function runTrial() {
      const t = TRIALS[currentIdx];
      currentInput = "";
      document.getElementById('userInputDisplay').innerText = "";
      document.getElementById('inputArea').classList.add('hidden');
      document.getElementById('displayArea').classList.remove('hidden');
      
      document.getElementById('phaseTitle').innerText = t.mode === 'forward' ? 'حافظه مستقیم (Forward)' : 'حافظه معکوس (Backward)';
      document.getElementById('levelBadge').innerText = `طول زنجیره: ${t.sequence.length}`;
      document.getElementById('instructionText').innerText = t.mode === 'forward' ? 'ارقام را به همان ترتیب دیده شده وارد کنید:' : 'ارقام را به ترتیب معکوس (از آخر به اول) وارد کنید:';
      document.getElementById('pBar').style.width = `${((currentIdx + 1) / TRIALS.length) * 100}%`;

      const digitBox = document.getElementById('digitBox');
      let seqIdx = 0;

      const timer = setInterval(() => {
        if (seqIdx < t.sequence.length) {
          digitBox.innerText = t.sequence[seqIdx];
          seqIdx++;
        } else {
          clearInterval(timer);
          digitBox.innerText = "✏️";
          setTimeout(() => {
            document.getElementById('displayArea').classList.add('hidden');
            document.getElementById('inputArea').classList.remove('hidden');
          }, 400);
        }
      }, 1000);
    }

    window.typeDigit = function(num) {
      if (currentInput.length < 6) {
        currentInput += num;
        document.getElementById('userInputDisplay').innerText = currentInput;
      }
    };

    window.clearInput = function() {
      currentInput = "";
      document.getElementById('userInputDisplay').innerText = "";
    };

    window.submitSequence = function() {
      if (currentInput === TRIALS[currentIdx].answer) {
        correctCount++;
      }
      currentIdx++;
      if (currentIdx < TRIALS.length) {
        runTrial();
      } else {
        finishSubtest();
      }
    };

    function finishSubtest() {
      const scaledScoreMap = [4, 7, 10, 13, 16];
      const scaledScore = scaledScoreMap[correctCount];

      const report = {
        test_name: "WISC-V Digit Span",
        timestamp: new Date().toISOString(),
        raw_score: correctCount,
        max_span: correctCount + 2,
        scaled_score: scaledScore
      };

      document.getElementById('gameCard').innerHTML = `
        <div class="space-y-3 py-6">
          <div class="text-emerald-400 text-4xl font-bold">✓</div>
          <h2 class="text-lg font-bold text-white">آزمون فراخنای ارقام به پایان رسید</h2>
          <p class="text-xs text-slate-400">اطلاعات با موفقیت ثبت شد.</p>
        </div>
      `;

      if (tg) {
        tg.sendData(JSON.stringify(report));
        setTimeout(() => tg.close(), 500);
      }
    }

    setTimeout(runTrial, 800);
  </script>
</body>
</html>
